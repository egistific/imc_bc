# Conda environment for the IMC lymph node pipeline.
# Versions match the setup the pipeline was tested with:
# Python 3.11 + Snakemake 9.22 + Astir 0.1.5, R 4.3 + Bioconductor 3.18.
# steinbock runs in Docker (ghcr.io/bodenmillergroup/steinbock:0.16.1) and is not part of this environment.
#
#   conda env create -f environment.yaml
#   conda activate imc-ln
name: imc-ln
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python: workflow and Astir ---
  - python=3.11
  - snakemake=9.22
  - pandas=2.3
  - numpy
  - pyyaml
  - pip
  - pip:
      - torch==2.14.1          # CUDA build from PyPI; Astir runs on the GPU when available
      - astir==0.1.5           # needs the np.NaN / np.Inf shim in scripts/04_run_astir.py

  # --- R: import, compensation, filtering, plots ---
  - r-base=4.3
  - bioconductor-imcrtools=1.8
  - bioconductor-spatialexperiment=1.12
  - bioconductor-singlecellexperiment=1.24
  - bioconductor-catalyst=1.26
  - bioconductor-scuttle=1.12
  - bioconductor-dittoseq=1.14
  - bioconductor-cytomapper=1.14
  - bioconductor-biocparallel=1.36
  - bioconductor-scran=1.30
  - bioconductor-bluster=1.12
  - bioconductor-flowsom=2.10
  - bioconductor-consensusclusterplus=1.66
  - r-kohonen
  - r-ggplot2
  - r-dplyr
  - r-data.table
  - r-yaml
  - r-scales
